{% set name = "arize-phoenix" %}
{% set version = "17.14.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/arize_phoenix-{{ version }}.tar.gz
  sha256: 9057076670602a1c04dfd0f6ffa98ef65b8189586253fff52accb787ffb9281a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-jupyter-builder
    - pip
  run:
    - python >={{ python_min }},<3.15
    - aioitertools
    - aiosqlite >=0.22.1
    - alembic >=1.3.0,<2
    - arize-phoenix-client >=2.10.0
    - arize-phoenix-evals >=3.1.0
    - arize-phoenix-otel >=0.16.1
    - authlib >=1.7.0
    - bashkit >=0.10.0
    - cachetools
    - email-validator
    - fastapi >=0.137.0
    - google-genai
    - greenlet !=0.4.17
    - grpc-interceptor
    - grpcio
    - httpx
    - jinja2
    - jmespath
    - joserfc
    - jsonpath-ng
    - jsonschema
    - ldap3
    - mcp
    - numpy
    - openinference-instrumentation >=0.1.44
    - openinference-instrumentation-openai >=0.1.41
    - openinference-semantic-conventions >=0.1.26
    - opentelemetry-exporter-otlp
    - opentelemetry-proto >=1.12.0
    - opentelemetry-sdk
    - opentelemetry-semantic-conventions
    - orjson
    - pandas >=1.0
    - prometheus_client
    - psutil
    - pyarrow
    - pydantic >=2.1.0,<3
    - pydantic-ai-slim >=2.0.0,<3
    - anthropic
    - boto3
    - aioboto3
    - openai
    - tiktoken
    - pystache
    - python-dateutil
    - python-multipart
    - pyyaml
    - scikit-learn
    - scipy
    - sqlalchemy >=2.0.46,<3
    - sqlean.py >=3.45.1
    - starlette >=0.37.0
    - strawberry-graphql >=0.319.0
    - tqdm
    - typing-extensions >=4.6
    - uvicorn
    - wrapt >=1.17.2,<3


test:
  requires:
    - python {{ python_min }}
  imports:
    - phoenix

about:
  summary: ML Observability in your notebook
  home: https://github.com/Arize-ai/phoenix
  doc_url: https://docs.arize.com/phoenix
  license: Elastic-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - anticorrelator
    - mikeldking
    - rogerhyang
    - michaelschiff
    - fjcasti1
    - axiomofjoy
